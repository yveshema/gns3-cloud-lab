[project]
name = "gns3-2620-lab"
version = "0.1.0"
description = "Per-student GCP fallback for BCIT networking-2620 GNS3 labs"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
gns3-2620-lab = "gns3_2620_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gns3_2620_lab"]

[tool.hatch.build.targets.wheel.force-include]
"provision.sh" = "gns3_2620_lab/provision.sh"

[dependency-groups]
dev = ["pytest>=8"]
